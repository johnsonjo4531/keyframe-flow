<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>keyframe-flow — vanilla TypeScript examples</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("kf-gallery-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
        } catch (_) {}
      })();
    </script>
    <script type="module" crossorigin src="/keyframe-flow/examples/assets/index-73IomlRf.js"></script>
